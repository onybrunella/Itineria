<form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
  <input type="text" formControlName="pseudo" placeholder="Pseudo" />
  <input type="email" formControlName="email" placeholder="Email" />
  <input type="password" formControlName="password" placeholder="Mot de passe (8 caractères min.)" />

  @if (errorMessage) {
    <p>{{ errorMessage }}</p>
  }

  <button type="submit" [disabled]="registerForm.invalid">S'inscrire</button>
  <p>Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
</form>
