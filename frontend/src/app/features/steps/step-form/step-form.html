<a [routerLink]="['/trips', tripId]">← Retour au voyage</a>
<h1>Nouvelle étape</h1>

<form (submit)="$event.preventDefault(); searchPlace()">
  <label>
    Rechercher un lieu
    <input type="text" [formControl]="searchQuery" />
  </label>
  <button type="submit">Rechercher</button>
</form>

@if (suggestions().length) {
  <ul class="place-results">
    @for (place of suggestions(); track place.display_name) {
      <li>
        <button type="button" (click)="selectPlace(place)">{{ place.display_name }}</button>
      </li>
    }
  </ul>
}

<form [formGroup]="stepForm" (ngSubmit)="onSubmit()">
  <label>
    Nom du lieu
    <input type="text" formControlName="locationName" readonly />
  </label>
  <label>
    Date
    <input type="date" formControlName="date" />
  </label>
  <label>
    Note
    <textarea formControlName="note"></textarea>
  </label>
  <label>
    Ordre
    <input type="number" formControlName="orderIndex" />
  </label>
  <button type="submit" [disabled]="stepForm.invalid">Ajouter l'étape</button>
</form>
