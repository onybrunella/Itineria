@if (trip(); as t) {
  <p>
    <a routerLink="/trips">← Mes voyages</a>
    ·
    <a [routerLink]="['/trips', t.id, 'scrapbook']">Voir le carnet</a>
  </p>
  <h1>{{ t.title }}</h1>
  <p>{{ t.description }}</p>
  <p>{{ t.startDate }} → {{ t.endDate }}</p>
  <span>{{ t.status }}</span>

  <app-trip-map
    [steps]="steps()"
    [selectedStep]="selectedStep()"
    (stepSelect)="onSelectStep($event)"
  />

  <h2>Étapes</h2>
  <p>
    <a [routerLink]="['/trips', t.id, 'steps', 'new']">Ajouter une étape</a>
    ·
    <a [routerLink]="['/trips', t.id, 'scrapbook']">Voir le carnet</a>
  </p>

  <app-trip-timeline
    [steps]="steps()"
    [selectedId]="selectedStep()?.id ?? null"
    (stepSelect)="onSelectStep($event)"
  />

  <app-step-photos [stepId]="selectedStep()?.id ?? null" />

  @if (selectedStep(); as s) {
    <p>
      <a [routerLink]="['/trips', t.id, 'scrapbook']" [fragment]="'step-' + s.id">
        Voir cette étape dans le carnet
      </a>
    </p>
  }
} @else {
  <p>Chargement du voyage...</p>
}
