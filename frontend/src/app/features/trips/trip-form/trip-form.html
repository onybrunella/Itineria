@if (tripId(); as id) {
  <p>
    <a [routerLink]="['/trips', id]">← Retour au voyage</a>
  </p>
  <h1>Modifier le voyage</h1>
} @else {
  <h1>Nouveau voyage</h1>
}

@if (!loaded()) {
  <div class="skeleton" role="status" aria-label="Chargement du voyage">
    <div class="skeleton-title"></div>
    <div class="skeleton-line"></div>
    <div class="skeleton-line short"></div>
  </div>
} @else {
  <form [formGroup]="tripForm" (ngSubmit)="onSubmit()">
    <label>
      Titre
      <input type="text" formControlName="title" />
    </label>
    <label>
      Description
      <textarea formControlName="description"></textarea>
    </label>
    <label>
      Date de début
      <input type="date" formControlName="startDate" />
    </label>
    <label>
      Date de fin
      <input type="date" formControlName="endDate" />
    </label>
    <label>
      Statut
      <select formControlName="status">
        <option value="DRAFT">Brouillon</option>
        <option value="PUBLISHED">Publié</option>
      </select>
    </label>

    <button type="submit" [disabled]="tripForm.invalid">
      {{ tripId() == null ? 'Créer' : 'Enregistrer' }}
    </button>
  </form>
}
